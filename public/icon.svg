<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    {/* Background Dark Obsidian Glass Gradient */}
    <linearGradient id="appBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#0a0f14" />
      <stop offset="100%" stop-color="#030709" />
    </linearGradient>

    {/* Border Ambient Glow */}
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.1" />
    </linearGradient>

    {/* Primary Emerald Neon Gradient */}
    <linearGradient id="emeraldMain" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="35%" stop-color="#10b981" />
      <stop offset="75%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>

    {/* Bow Gradient */}
    <linearGradient id="bowMetallic" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    {/* Golden Cyan Accent */}
    <linearGradient id="goldCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    {/* Deep Glow Filter */}
    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="centerLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#059669" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>
  
  {/* App Icon Rounded Squircle Container */}
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#appBgGrad)" stroke="url(#borderGrad)" stroke-width="6" />
  
  {/* Subtle Ambient Radial Center Glow */}
  <circle cx="256" cy="256" r="210" fill="url(#centerLight)" />

  {/* Quant Reticle & Orbital Scanning Rings */}
  <circle cx="256" cy="256" r="190" fill="none" stroke="#10b981" stroke-width="1.8" stroke-opacity="0.22" stroke-dasharray="6,8" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.28" stroke-dasharray="3,5" />
  <circle cx="256" cy="256" r="85" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25" />

  {/* Crosshair Axes */}
  <line x1="256" y1="56" x2="256" y2="86" stroke="#10b981" stroke-width="2" stroke-opacity="0.4" />
  <line x1="256" y1="426" x2="256" y2="456" stroke="#10b981" stroke-width="2" stroke-opacity="0.4" />
  <line x1="56" y1="256" x2="86" y2="256" stroke="#10b981" stroke-width="2" stroke-opacity="0.4" />
  <line x1="426" y1="256" x2="456" y2="256" stroke="#10b981" stroke-width="2" stroke-opacity="0.4" />

  {/* Archery Bow Curve (Precision Engineered Arc) */}
  <path 
    d="M 140 395 C 80 305 80 207 140 117 C 168 85 200 75 220 75 C 220 95 198 112 178 145 C 140 210 140 302 178 367 C 198 400 220 417 220 437 C 200 437 168 427 140 395 Z" 
    fill="url(#bowMetallic)" 
    stroke="#047857" 
    stroke-width="3" 
  />

  {/* Bow Inner High-Reflectivity Bevel Line */}
  <path 
    d="M 152 375 C 104 300 104 212 152 137" 
    fill="none" 
    stroke="#6ee7b7" 
    stroke-width="6" 
    stroke-linecap="round" 
    stroke-opacity="0.85" 
  />

  {/* High-Tension Bowstring */}
  <path 
    d="M 220 75 L 146 256 L 220 437" 
    fill="none" 
    stroke="#cbd5e1" 
    stroke-width="7" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
    stroke-opacity="0.8" 
  />

  {/* Laser Arrow Shaft with Radiant Glow */}
  <g filter="url(#coreGlow)">
    <line x1="130" y1="256" x2="400" y2="256" stroke="url(#emeraldMain)" stroke-width="18" stroke-linecap="round" />
    <line x1="145" y1="256" x2="385" y2="256" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
  </g>

  {/* Diamond / Falcon Arrowhead (High-Speed Breakthrough) */}
  <g filter="url(#coreGlow)">
    <polygon points="435,256 320,185 350,256 320,327" fill="url(#emeraldMain)" stroke="#6ee7b7" stroke-width="4" stroke-linejoin="round" />
    <line x1="350" y1="256" x2="435" y2="256" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  </g>

  {/* Arrow Fletching / Stabilizer Wings (Tail Aerodynamics) */}
  <g stroke="url(#goldCyanGrad)" stroke-width="10" stroke-linecap="round">
    <line x1="150" y1="256" x2="95" y2="195" />
    <line x1="150" y1="256" x2="95" y2="317" />
    <line x1="185" y1="256" x2="135" y2="195" />
    <line x1="185" y1="256" x2="135" y2="317" />
  </g>

  {/* Center Nock Gold Lock Jewel */}
  <circle cx="146" cy="256" r="14" fill="#fbbf24" stroke="#047857" stroke-width="4" />
  <circle cx="146" cy="256" r="6" fill="#ffffff" />

  {/* Financial Candlestick Breakout Momentum Nodes */}
  <g opacity="0.9">
    <line x1="330" y1="365" x2="330" y2="425" stroke="#34d399" stroke-width="4" stroke-linecap="round" />
    <rect x="322" y="380" width="16" height="30" rx="4" fill="#10b981" />

    <line x1="375" y1="340" x2="375" y2="415" stroke="#34d399" stroke-width="4" stroke-linecap="round" />
    <rect x="367" y="355" width="16" height="40" rx="4" fill="#10b981" />

    <line x1="420" y1="315" x2="420" y2="405" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <rect x="412" y="330" width="16" height="50" rx="4" fill="#38bdf8" />
  </g>

  {/* Speed Particles */}
  <circle cx="445" cy="215" r="5" fill="#38bdf8" />
  <circle cx="460" cy="275" r="6" fill="#34d399" />
  <circle cx="405" cy="165" r="4" fill="#fbbf24" />
</svg>
