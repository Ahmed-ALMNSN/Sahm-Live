<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- App Icon Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8" />
  
  <!-- Inner circular subtle glow -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.2" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6,6" stroke-opacity="0.3" />

  <!-- Archery Bow Curve -->
  <path d="M 145 375 Q 360 256 145 137" fill="none" stroke="#10b981" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Bowstring -->
  <line x1="145" y1="137" x2="145" y2="375" stroke="#64748b" stroke-width="5" stroke-dasharray="6,4" />

  <!-- Stock Trend Arrow (Piercing Upwards & Rightwards) -->
  <g filter="url(#glow)">
    <line x1="140" y1="256" x2="385" y2="256" stroke="url(#emeraldGrad)" stroke-width="16" stroke-linecap="round" />
    <!-- Arrowhead -->
    <polygon points="385,256 325,215 345,256 325,297" fill="url(#emeraldGrad)" />
    <!-- Fletching/Feathers -->
    <line x1="150" y1="256" x2="115" y2="225" stroke="#34d399" stroke-width="8" stroke-linecap="round" />
    <line x1="150" y1="256" x2="115" y2="287" stroke="#34d399" stroke-width="8" stroke-linecap="round" />
    <line x1="175" y1="256" x2="145" y2="230" stroke="#34d399" stroke-width="8" stroke-linecap="round" />
    <line x1="175" y1="256" x2="145" y2="282" stroke="#34d399" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Stock Candlestick bars mini accent -->
  <g opacity="0.85">
    <line x1="280" y1="330" x2="280" y2="370" stroke="#34d399" stroke-width="4" stroke-linecap="round" />
    <rect x="274" y="340" width="12" height="20" rx="3" fill="#10b981" />

    <line x1="320" y1="310" x2="320" y2="360" stroke="#34d399" stroke-width="4" stroke-linecap="round" />
    <rect x="314" y="320" width="12" height="25" rx="3" fill="#10b981" />

    <line x1="360" y1="290" x2="360" y2="350" stroke="#34d399" stroke-width="4" stroke-linecap="round" />
    <rect x="354" y="300" width="12" height="32" rx="3" fill="#34d399" />
  </g>
</svg>
